name: Deploy to GitHub Pages

# The site is static: one HTML file plus the social-preview image it links to.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run is superseded by the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `enablement: true` here on purpose: creating the Pages site needs
      # repo-admin rights, which the workflow's GITHUB_TOKEN does not have even
      # with `pages: write` (it answers "Create Pages site failed. Error:
      # Resource not accessible by integration"). Pages has to be switched on
      # once by hand; after that this step just reads the existing config.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      # Only the files the site actually serves. Publishing the repository
      # root also shipped the benchmark harness, its reference PNGs and the
      # lockfile — around 200 KB of images nobody visiting the page asks for,
      # and a needlessly wide public surface.
      - name: Stage the site
        run: |
          mkdir -p _site/docs
          cp index.html _site/
          cp docs/preview.png _site/docs/
          echo "--- staged ---"
          find _site -type f | sort

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
