name: Deploy to GitHub Pages

# The site is static, so the repository is published as-is.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run is superseded by the newest one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `enablement: true` here on purpose: creating the Pages site needs
      # repo-admin rights, which the workflow's GITHUB_TOKEN does not have even
      # with `pages: write` (it answers "Create Pages site failed. Error:
      # Resource not accessible by integration"). Pages has to be switched on
      # once by hand; after that this step just reads the existing config.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
