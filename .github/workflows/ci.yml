name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run check

  gates:
    name: Physics gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npx playwright install --with-deps chromium

      # Only the physics phase runs here. These gates are hardware independent:
      # no marble may ever end a step outside the glass, kinetic energy must not
      # drift with restitution at 1, and marbles must still cross between lobes
      # (a floor of 150 against a figure that is now reproducibly 154 — see
      # README.md for what made it reproducible).
      # The render metrics are deliberately not gated in CI: frame time carries
      # 27% run-to-run variance on a CPU rasteriser (see bench/README.md), and
      # the reference screenshots are rendered on the maintainer's machine, not
      # on the runner, so both would be flaky rather than informative.
      - name: Physics non-regression gates
        run: npm run bench:gates
