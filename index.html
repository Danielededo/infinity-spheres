<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Infinity Spheres — Lemniscata di Bernoulli</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%2305070c'/%3E%3Ctext x='16' y='23' font-size='22' text-anchor='middle' fill='%237cc7ff'%3E%E2%88%9E%3C/text%3E%3C/svg%3E" />
<meta name="description" content="30 sfere physical che scorrono lungo una lemniscata di Bernoulli con collisioni elastiche, in Three.js." />
<style>
  :root {
    --bg: #05070c;
    --fg: #e8ecf6;
    --muted: #93a0bb;
    --panel: rgba(12, 17, 28, 0.62);
    --stroke: rgba(150, 180, 255, 0.16);
    --accent: #7cc7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas { display: block; }

  #hud {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: max(16px, env(safe-area-inset-left));
    width: min(300px, calc(100vw - 32px));
    padding: 14px 16px 12px;
    border: 1px solid var(--stroke);
    border-radius: 14px;
    background: var(--panel);
    backdrop-filter: blur(14px) saturate(1.2);
    -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    transition: opacity .25s ease, transform .25s ease;
  }
  #hud.hidden { opacity: 0; transform: translateY(-8px); pointer-events: none; }

  #hud h1 {
    margin: 0 0 2px;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: .01em;
  }
  #hud h1 span { color: var(--accent); }
  #hud .sub { margin: 0 0 12px; color: var(--muted); font-size: 11.5px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .stat {
    padding: 7px 8px;
    border: 1px solid var(--stroke);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.03);
  }
  .stat b { display: block; font-size: 14px; font-weight: 620; font-variant-numeric: tabular-nums; }
  .stat i { font-style: normal; color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }

  .row { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .row label { flex: 0 0 66px; color: var(--muted); font-size: 11.5px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row output { flex: 0 0 40px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 11.5px; }

  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  button {
    flex: 1 1 auto;
    padding: 7px 10px;
    color: var(--fg);
    font: inherit;
    font-size: 11.5px;
    border: 1px solid var(--stroke);
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.04);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  button:hover { background: rgba(124, 199, 255, 0.14); border-color: rgba(124, 199, 255, 0.4); }
  button[aria-pressed="true"] { background: rgba(124, 199, 255, 0.2); border-color: rgba(124, 199, 255, 0.55); }

  #hud .keys { margin: 11px 0 0; color: var(--muted); font-size: 10.5px; }
  kbd {
    padding: 1px 5px;
    border: 1px solid var(--stroke);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.05);
    font: inherit;
    font-size: 10px;
  }

  #note {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    pointer-events: none;
  }
  @media (max-width: 640px) { #note { display: none; } }
</style>
</head>
<body>

<div id="hud">
  <h1>Lemniscata di <span>Bernoulli</span> ∞</h1>
  <p class="sub">30 sfere physical, collisioni elastiche 1D lungo la curva.</p>

  <div class="stats">
    <div class="stat"><b id="s-count">0</b><i>sfere</i></div>
    <div class="stat"><b id="s-hits">0</b><i>urti</i></div>
    <div class="stat"><b id="s-fps">0</b><i>fps</i></div>
  </div>

  <div class="row">
    <label for="speed">Velocità</label>
    <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
    <output id="speed-out">1.00×</output>
  </div>

  <div class="btns">
    <button id="btn-pause" aria-pressed="false">Pausa</button>
    <button id="btn-path" aria-pressed="true">Percorso</button>
    <button id="btn-rotate" aria-pressed="true">Rotazione</button>
    <button id="btn-reset">Reset</button>
  </div>

  <p class="keys">
    <kbd>spazio</kbd> pausa · <kbd>P</kbd> percorso · <kbd>A</kbd> rotazione · <kbd>R</kbd> reset · <kbd>H</kbd> HUD
  </p>
</div>

<p id="note">Trascina per orbitare · rotella per zoom · tasto destro per pan</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ *
 * Parametri della simulazione
 * ------------------------------------------------------------------ */
const CONF = {
  spheres: 30,       // numero di sfere
  a: 20,             // semi-larghezza della lemniscata
  lift: 3.6,         // separazione verticale dei due rami all'incrocio
  rMin: 0.55,        // raggio minimo
  rMax: 1.25,        // raggio massimo
  vMin: 2.0,         // velocità iniziale minima (unità/s)
  vMax: 7.5,         // velocità iniziale massima (unità/s)
  restitution: 1.0,  // 1 = urto perfettamente elastico
};

/* ------------------------------------------------------------------ *
 * Curva: lemniscata di Bernoulli
 *
 *   x = a·cos t / (1 + sin²t)
 *   z = a·sin t·cos t / (1 + sin²t)
 *
 * La curva piana si auto-interseca nell'origine (t = π/2 e t = 3π/2):
 * il termine y = lift·sin t separa i due rami in verticale, così le
 * sfere non si compenetrano nel punto di incrocio e la figura resta
 * un ∞ perfetto visto dall'alto.
 * ------------------------------------------------------------------ */
class LemniscateCurve extends THREE.Curve {
  constructor(a = CONF.a, lift = CONF.lift) {
    super();
    this.a = a;
    this.lift = lift;
  }
  getPoint(t, target = new THREE.Vector3()) {
    const u = t * Math.PI * 2;
    const s = Math.sin(u), c = Math.cos(u);
    const d = 1 + s * s;
    return target.set(this.a * c / d, this.lift * s, this.a * s * c / d);
  }
}

const curve = new LemniscateCurve();
curve.arcLengthDivisions = 4000;          // LUT densa: getPointAt() ~ arco costante
const LENGTH = curve.getLength();          // lunghezza totale del circuito

/* ------------------------------------------------------------------ *
 * Renderer / scena / camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05070c, 0.0085);

const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(30, 18, 40);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 8;
controls.maxDistance = 140;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.45;
controls.target.set(0, 0, 0);

/* ------------------------------------------------------------------ *
 * Ambiente: equirettangolare procedurale -> PMREM
 * Serve al materiale physical per riflessi credibili senza asset esterni.
 * ------------------------------------------------------------------ */
function makeGradientEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const g = c.getContext('2d');

  const sky = g.createLinearGradient(0, 0, 0, c.height);
  sky.addColorStop(0.00, '#9fc4ff');
  sky.addColorStop(0.35, '#33507f');
  sky.addColorStop(0.55, '#0d1424');
  sky.addColorStop(1.00, '#04060b');
  g.fillStyle = sky;
  g.fillRect(0, 0, c.width, c.height);

  // sorgenti luminose morbide, per far vivere i riflessi speculari
  const blobs = [
    [0.20, 0.22, 210, 'rgba(255,246,220,0.95)'],
    [0.66, 0.16, 170, 'rgba(150,205,255,0.85)'],
    [0.88, 0.44, 150, 'rgba(255,140,190,0.55)'],
    [0.42, 0.72, 220, 'rgba(90,255,220,0.30)'],
  ];
  for (const [x, y, r, col] of blobs) {
    const rg = g.createRadialGradient(x * c.width, y * c.height, 0, x * c.width, y * c.height, r);
    rg.addColorStop(0, col);
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, c.width, c.height);
  }

  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const envSource = makeGradientEnvTexture();
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
scene.environment = pmrem.fromEquirectangular(envSource).texture;
scene.background = envSource;
scene.backgroundIntensity = 0.32;
scene.backgroundBlurriness = 0.45;
pmrem.dispose();

/* ------------------------------------------------------------------ *
 * Luci
 * ------------------------------------------------------------------ */
scene.add(new THREE.HemisphereLight(0x9dc4ff, 0x0a0d16, 0.75));

const key = new THREE.DirectionalLight(0xfff3dd, 2.6);
key.position.set(26, 34, 18);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.02;
const sc = key.shadow.camera;
sc.left = -34; sc.right = 34; sc.top = 34; sc.bottom = -34;
sc.near = 1; sc.far = 120;
scene.add(key);

const rim = new THREE.DirectionalLight(0x88bcff, 1.1);
rim.position.set(-22, 8, -26);
scene.add(rim);

const warm = new THREE.PointLight(0xff8ab8, 90, 90, 2);
warm.position.set(-CONF.a * 0.75, 6, 0);
scene.add(warm);

const cool = new THREE.PointLight(0x63f7d6, 90, 90, 2);
cool.position.set(CONF.a * 0.75, -6, 0);
scene.add(cool);

/* ------------------------------------------------------------------ *
 * Piano d'appoggio (raccoglie le ombre, sfuma nella nebbia)
 * ------------------------------------------------------------------ */
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(70, 72),
  new THREE.MeshStandardMaterial({ color: 0x0a0e18, roughness: 0.72, metalness: 0.1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -10;
floor.receiveShadow = true;
scene.add(floor);

/* ------------------------------------------------------------------ *
 * Il percorso, come tubo sottile
 * ------------------------------------------------------------------ */
const pathMesh = new THREE.Mesh(
  new THREE.TubeGeometry(curve, 900, 0.055, 10, true),
  new THREE.MeshBasicMaterial({ color: 0x6fb4ff, transparent: true, opacity: 0.4 })
);
scene.add(pathMesh);

/* ------------------------------------------------------------------ *
 * Le sfere: ogni sfera è una "perlina" vincolata alla curva.
 * Stato = ascissa curvilinea normalizzata u ∈ [0,1) + velocità v (unità/s).
 * ------------------------------------------------------------------ */
const geometry = new THREE.SphereGeometry(1, 32, 24);
const beads = [];
let hits = 0;

const wrap01 = (u) => u - Math.floor(u);
const rand = (min, max) => min + Math.random() * (max - min);

function buildSpheres() {
  for (const b of beads) {
    scene.remove(b.mesh);
    b.mesh.material.dispose();
  }
  beads.length = 0;
  hits = 0;

  const n = CONF.spheres;
  for (let i = 0; i < n; i++) {
    const r = rand(CONF.rMin, CONF.rMax);

    // tonalità distribuite su tutto il cerchio cromatico, con saturazione
    // e luminosità variate: colori diversi *e* tonalità diverse
    const hue = wrap01(i / n + rand(-0.02, 0.02));
    const color = new THREE.Color().setHSL(hue, rand(0.55, 1.0), rand(0.42, 0.66));

    const material = new THREE.MeshPhysicalMaterial({
      color,
      metalness: rand(0.05, 0.62),
      roughness: rand(0.06, 0.5),
      clearcoat: rand(0.3, 1.0),
      clearcoatRoughness: rand(0.02, 0.25),
      sheen: rand(0.0, 0.5),
      sheenColor: color.clone().offsetHSL(0.08, 0, 0.15),
      envMapIntensity: 1.4,
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.scale.setScalar(r);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);

    beads.push({
      mesh,
      r,
      m: r * r * r,                                   // massa ∝ volume
      u: i / n,                                       // partenza equispaziata
      v: rand(CONF.vMin, CONF.vMax) * (Math.random() < 0.5 ? -1 : 1),
    });
  }
  document.getElementById('s-count').textContent = String(beads.length);
  placeMeshes();
}

const tmp = new THREE.Vector3();
function placeMeshes() {
  for (const b of beads) b.mesh.position.copy(curve.getPointAt(b.u, tmp));
}

/* ------------------------------------------------------------------ *
 * Collisioni elastiche
 *
 * Le sfere sono vincolate a una curva chiusa: il contatto avviene solo
 * tra vicini in ascissa curvilinea, quindi il problema è un urto 1D.
 *   v1' = ((m1-m2)·v1 + 2·m2·v2) / (m1+m2)
 *   v2' = ((m2-m1)·v2 + 2·m1·v1) / (m1+m2)
 * Con restitution = 1 quantità di moto ed energia cinetica si conservano.
 * ------------------------------------------------------------------ */
const order = [];
function solveCollisions() {
  order.length = 0;
  for (let i = 0; i < beads.length; i++) order.push(i);
  order.sort((i, j) => beads[i].u - beads[j].u);

  for (let k = 0; k < order.length; k++) {
    const A = beads[order[k]];
    const B = beads[order[(k + 1) % order.length]];
    if (A === B) break;

    let du = B.u - A.u;
    if (du < 0) du += 1;                  // coppia che scavalca u = 0
    const gap = du * LENGTH - (A.r + B.r);
    if (gap >= 0) continue;

    const mSum = A.m + B.m;

    // scambio di velocità solo se si stanno avvicinando
    if (B.v - A.v < 0) {
      const vA = ((A.m - B.m) * A.v + 2 * B.m * B.v) / mSum;
      const vB = ((B.m - A.m) * B.v + 2 * A.m * A.v) / mSum;
      const e = CONF.restitution;
      const vCm = (A.m * A.v + B.m * B.v) / mSum;
      A.v = vCm + (vA - vCm) * e;
      B.v = vCm + (vB - vCm) * e;
      hits++;
    }

    // separazione posizionale, ripartita in modo inversamente proporzionale alla massa
    const overlap = -gap / LENGTH;
    A.u = wrap01(A.u - overlap * (B.m / mSum));
    B.u = wrap01(B.u + overlap * (A.m / mSum));
  }
}

/* ------------------------------------------------------------------ *
 * Loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
const ui = {
  hits: document.getElementById('s-hits'),
  fps: document.getElementById('s-fps'),
};
let paused = false;
let timeScale = 1;
let fpsAcc = 0, fpsFrames = 0;

function step(dt) {
  const h = dt * timeScale;
  if (h <= 0) return;

  // Gli urti elastici tra masse diverse redistribuiscono l'energia: una sfera
  // leggera può superare i 35 unità/s. Il passo viene suddiviso perché lo
  // spostamento per sotto-passo resti inferiore a mezzo raggio minimo,
  // altrimenti a velocità alte le sfere si attraversano invece di urtarsi.
  let vMax = 0;
  for (const b of beads) vMax = Math.max(vMax, Math.abs(b.v));
  const sub = Math.min(16, Math.max(1, Math.ceil((h * vMax) / (0.5 * CONF.rMin))));
  const hs = h / sub;

  for (let s = 0; s < sub; s++) {
    for (const b of beads) b.u = wrap01(b.u + (b.v * hs) / LENGTH);

    // due passate: con 30 corpi ravvicinati stabilizza le catene di urti
    solveCollisions();
    solveCollisions();
  }

  placeMeshes();
}

renderer.setAnimationLoop(() => {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 1 / 30);   // clamp: niente salti dopo un blur di tab

  if (!paused) step(dt);
  controls.update();
  renderer.render(scene, camera);

  // il contatore usa il tempo reale, non quello clampato: altrimenti su una
  // macchina lenta resterebbe inchiodato a 30 fps qualunque sia la resa
  fpsAcc += raw; fpsFrames++;
  if (fpsAcc >= 0.5) {
    ui.fps.textContent = String(Math.round(fpsFrames / fpsAcc));
    ui.hits.textContent = hits.toLocaleString('it-IT');
    fpsAcc = 0; fpsFrames = 0;
  }
});

/* ------------------------------------------------------------------ *
 * Controlli UI
 * ------------------------------------------------------------------ */
const btnPause = document.getElementById('btn-pause');
const btnPath = document.getElementById('btn-path');
const btnRotate = document.getElementById('btn-rotate');
const btnReset = document.getElementById('btn-reset');
const hud = document.getElementById('hud');
const speed = document.getElementById('speed');
const speedOut = document.getElementById('speed-out');

function togglePause() {
  paused = !paused;
  btnPause.textContent = paused ? 'Riprendi' : 'Pausa';
  btnPause.setAttribute('aria-pressed', String(paused));
}
function togglePath() {
  pathMesh.visible = !pathMesh.visible;
  btnPath.setAttribute('aria-pressed', String(pathMesh.visible));
}
function toggleRotate() {
  controls.autoRotate = !controls.autoRotate;
  btnRotate.setAttribute('aria-pressed', String(controls.autoRotate));
}

btnPause.addEventListener('click', togglePause);
btnPath.addEventListener('click', togglePath);
btnRotate.addEventListener('click', toggleRotate);
btnReset.addEventListener('click', buildSpheres);

speed.addEventListener('input', () => {
  timeScale = Number(speed.value);
  speedOut.textContent = timeScale.toFixed(2) + '×';
});

addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement) return;
  switch (e.code) {
    case 'Space': e.preventDefault(); togglePause(); break;
    case 'KeyP': togglePath(); break;
    case 'KeyA': toggleRotate(); break;
    case 'KeyR': buildSpheres(); break;
    case 'KeyH': hud.classList.toggle('hidden'); break;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

buildSpheres();
</script>
</body>
</html>
